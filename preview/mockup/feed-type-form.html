<aside class="review" aria-label="Alat review, bukan bagian aplikasi"><div><h1>TERNAVA · Preview</h1><p class="small muted">Data contoh rekaan. Aksi dan koneksi disimulasikan.</p><a class="review-link" data-ac="AC-900" href="../index.html">Semua layar</a></div><div class="review-tools"><label for="state-select">State layar<select id="state-select" data-ac="AC-900"><option value="default">default</option><option value="error">error</option><option value="offline">offline</option><option value="success">success</option></select></label><label for="role-select">Role contoh<select id="role-select" data-ac="AC-900"><option value="operator">Operator</option><option value="admin">Admin</option><option value="owner">Pemilik</option></select></label></div></aside>
<div class="device" id="app"></div><p class="review-foot">feed-type-form · AC-17 · Guided Flow</p>
<dialog id="app-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="actions"><button data-ac="AC-25" class="secondary" id="dialog-cancel" type="button" autofocus>Tetap di aplikasi</button><button data-ac="AC-25" class="primary" id="dialog-confirm" type="button">Lanjutkan</button></div></dialog>
<script>const CFG={"id": "feed-type-form", "title": "Jenis pakan", "archetype": "Guided Flow", "ac": "AC-17", "states": ["default", "error", "offline", "success"], "role": "owner", "back": "feed-stock", "subtitle": "Satuan kg dan batas minimum persediaan.", "empty": null};

const icons={back:'<path d="m14 6-6 6 6 6"/>',next:'<path d="m9 6 6 6-6 6"/>',home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',barn:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M8 20V10h8v10M8 15h8"/>',feed:'<path d="M5 7h14l2 14H3zM7 7l1-4h8l1 4M8 12h8M8 16h5"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',bell:'<path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 21h4"/>',sync:'<path d="M20 8a8 8 0 0 0-13-4L3 8M3 3v5h5M4 16a8 8 0 0 0 13 4l4-4M21 21v-5h-5"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="m12 3 10 18H2zM12 9v5M12 17h.01"/>',note:'<path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',egg:'<path d="M19 15c0 4-3 6-7 6s-7-2-7-6S9 3 12 3s7 8 7 12Z"/>',tasks:'<path d="M9 5h12M9 12h12M9 19h12M2 5l1 1 2-2M2 12l1 1 2-2M2 19l1 1 2-2"/>',export:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.note}</svg>`;
const escapeHTML=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
let state=CFG.states.includes(params.get('state'))?params.get('state'):'default';
let role=['owner','admin','operator'].includes(params.get('role'))?params.get('role'):CFG.role;
let dirty=false,lastFocus=null,dialogAction=null;
const ac=CFG.ac;
const tag=`data-ac="${ac}"`;
const href=(id,s='default')=>`${id}.html?role=${role}${s==='default'?'':'&state='+s}`;
const link=(id,text,style='secondary',s='default')=>`<a ${tag} class="${style}" href="${href(id,s)}">${text}</a>`;
const button=(text,action,style='secondary',extra='')=>`<button ${tag} class="${style}" type="button" data-action="${action}" ${extra}>${text}</button>`;
const notice=(title,text='',tone='')=>`<div class="notice ${tone}"><strong>${title}</strong>${text?'<p>'+text+'</p>':''}</div>`;
const status=(text,tone='')=>`<span class="status ${tone}">${icon(tone==='good'?'check':tone==='warn'?'clock':tone==='danger'?'alert':'note')}${text}</span>`;
const row=(title,sub,destination,st='',tone='',extra='')=>`<a ${tag} class="row" href="${rowHref(destination,title,sub,st)}"><div class="row-copy"><strong>${title}</strong><p>${sub}</p>${st?status(st,tone):''}${extra}</div><span class="row-chevron">${icon('next')}</span></a>`;
const section=(title,body,action='')=>`<section class="section"><div class="section-head"><h2>${title}</h2>${action}</div>${body}</section>`;
const field=(name,label,value='',type='text',unit='',required=false,hint='')=>`<div class="field" data-field="${name}"><label for="${name}">${label}${required?' <span class="sr-only">(wajib)</span>':''}</label>${unit?'<div class="input-wrap">':''}<input ${tag} id="${name}" name="${name}" type="${type}" value="${escapeHTML(value)}" ${required?'required':''} ${type==='number'?'min="0" step="'+(unit==='kg'?'0.01':'1')+'" inputmode="'+(unit==='kg'?'decimal':'numeric')+'"':''} ${name==='username'?'autocomplete="username"':''} ${name==='password'?'autocomplete="current-password"':''} ${type==='password'&&name!=='password'&&name!=='old-password'?'minlength="12" autocomplete="new-password"':''}>${unit?'<span class="unit">'+unit+'</span></div>':''}${hint?'<p class="hint">'+hint+'</p>':''}<p class="field-error" id="err-${name}"></p></div>`;
const select=(name,label,options,selected='')=>`<div class="field" data-field="${name}"><label for="${name}">${label}</label><select ${tag} id="${name}" name="${name}">${options.map(o=>`<option ${o===selected?'selected':''}>${o}</option>`).join('')}</select></div>`;
const area=(name,label,value='',required=false)=>`<div class="field" data-field="${name}"><label for="${name}">${label}</label><textarea ${tag} id="${name}" name="${name}" ${required?'required':''}>${value}</textarea><p class="field-error" id="err-${name}"></p></div>`;
const check=(name,label,checked=false)=>`<label class="check"><input ${tag} type="checkbox" name="${name}" ${checked?'checked':''}>${label}</label>`;
const form=(body,cta,success='success',secondary='')=>`<form id="product-form" data-result="${success}" novalidate>${body}<div id="form-message" role="alert"></div><div class="actions"><button ${tag} class="primary" type="submit">${cta}</button>${secondary}</div></form>`;
const search=(label)=>`<div class="field"><label for="search">${label}</label><input ${tag} id="search" class="search" type="search" placeholder="Cari nama atau kandang"></div>`;
const filters=(choices)=>`<div class="filter-row">${choices.map((c,i)=>`<button ${tag} class="filter" type="button" aria-pressed="${(CFG.id==='flock-list'?c===(state==='finished'?'Selesai':'Aktif'):i===0)}" data-filter="${c}">${c}</button>`).join('')}</div>`;
const todayDate='Kamis, 1 Oktober 2026';
const sampleFarm='Peternakan Ayam Petelur Sumber Rezeki Lumajang';
const cageOptions=['Kandang A · LYR-A-2601','Kandang B · LYR-B-2602','Kandang C · LYR-C-2603'];
const cagePicker=()=>select('cage','Kandang dan kelompok ayam',role==='operator'?cageOptions.filter(x=>!x.startsWith('Kandang B')):cageOptions);
const photo=()=>`<div class="field"><label for="photo">Foto pendukung (opsional)</label><button ${tag} type="button" class="secondary" data-action="choose-photo">Pilih foto</button><input ${tag} id="photo" type="file" accept="image/*" hidden><p class="hint" id="photo-status">Teks catatan tetap disimpan jika foto belum terkirim.</p></div>`;
const sections={};

function rowHref(destination,title,sub,st){
 let url=href(destination);
 const match=(title+' '+sub).match(/Kandang [ABC]/);
 if(match&&['flock-list','daily-form','daily-history','task-detail','incident-detail'].includes(destination))url+='&cage='+encodeURIComponent(match[0]);
 if(title.includes('30 September 2026')&&destination==='daily-form')url+='&date=2026-09-30';
 if(['task-detail','incident-detail'].includes(destination))url+='&title='+encodeURIComponent(title)+'&subtitle='+encodeURIComponent(sub);
 if(st.startsWith('Selesai')&&['task-detail','incident-detail'].includes(destination))url+='&state=success';
 if(st.includes('belum ditugaskan')&&destination==='incident-detail')url+='&state=unassigned';
 return url;
}

sections['login']=()=>form(field('username','Nama pengguna','sari.wulandari','text','',true)+field('password','Sandi','','password','',true)+`<p class="hint">Belum punya akun atau lupa sandi? Minta pengelola peternakan mengatur akses Anda.</p>`,'Masuk','success');
sections['farm-setup']=()=>form(field('farm','Nama peternakan',sampleFarm,'text','',true)+field('city','Lokasi','Lumajang, Jawa Timur','text','',true)+select('timezone','Zona waktu peternakan',['Asia/Jakarta (WIB)','Asia/Makassar (WITA)','Asia/Jayapura (WIT)'])+notice('Tanggal mengikuti peternakan','Pergantian hari laporan mengikuti zona waktu ini. Perubahan setelah pencatatan dimulai perlu ditinjau pengelola.')+`<p class="hint">Satu peternakan dan satu gudang pakan untuk MVP.</p>`,'Simpan pengaturan');
sections['cage-list']=()=>search('Cari kandang')+`<div class="rows" id="filterable">`+row('Kandang A','LYR-A-2601 · 2.398 ekor','flock-list','Pakan dan telur tercatat','good')+row('Kandang B','LYR-B-2602 · 1.950 ekor','flock-list','Pakan dan telur tercatat','good')+row('Kandang C','LYR-C-2603 · 1.680 ekor','flock-list','Belum dicatat','warn')+`</div><p class="no-results" hidden>Tidak ada kandang dengan nama itu.</p>`+(role==='operator'?'':`<div class="actions">${link('cage-form',icon('plus')+'Tambah kandang','primary')}</div>`);
sections['cage-form']=()=>form(field('cage-name','Nama kandang','Kandang D','text','',true)+field('cage-code','Kode kandang','KD-D','text','',true)+area('description','Keterangan (opsional)','Kandang sisi timur gudang.')+notice('Kelompok ayam dibuat berikutnya','Populasi awal dicatat saat menempatkan kelompok ayam.'),'Simpan kandang');
sections['flock-list']=()=>filters(['Aktif','Selesai'])+`<div class="rows" id="filterable">`+(state==='finished'?row('LYR-A-2501','Kandang A · 12 Januari–15 Desember 2025','flock-form','Kelompok selesai'):row('LYR-A-2601','Kandang A · Mulai 12 Januari 2026','daily-form','Populasi tercatat 2.398 ekor','good')+row('LYR-C-2603','Kandang C · Mulai 8 Maret 2026','daily-form','Populasi tercatat 1.680 ekor'))+`</div>`+(role==='operator'?'':`<div class="actions">${link('flock-form','Tambah kelompok','primary')}</div>`)+section('Riwayat populasi',`<div class="stat-line"><span>Populasi awal LYR-A-2601</span><span class="num">2.400 ekor</span></div><div class="stat-line"><span>Kematian tercatat</span><span class="num">2 ekor</span></div><p class="hint">Perubahan yang belum dicatat tidak dianggap nol.</p>`);
sections['flock-form']=()=>form(field('flock-name','Kode kelompok','LYR-D-2610','text','',true)+select('cage','Kandang',['Kandang D','Kandang A','Kandang B','Kandang C'])+field('placed','Tanggal penempatan','2026-10-01','date','',true)+field('population','Populasi awal','2100','number','ekor',true)+select('flock-status','Status kelompok',['Aktif','Selesai'])+(state==='edit'?area('change-reason','Alasan perubahan','',true):'')+notice('Jaga riwayat populasi','Koreksi setelah ada catatan operasional membutuhkan alasan dan pemeriksaan pengelola.'),'Simpan kelompok');
sections['team-list']=()=>search('Cari pengguna')+`<div class="rows" id="filterable">`+row('Budi Santoso','Pemilik · seluruh peternakan','member-form','Owner aktif','good')+row('Rina Handayani','Admin · seluruh peternakan','member-form','Aktif','good')+row('Sari Wulandari','Operator · Kandang A dan C','member-form','Aktif','good')+`</div><p class="no-results" hidden>Tidak ada pengguna dengan nama itu.</p><div class="actions">${link('member-form','Tambah pengguna','primary')}</div>`;
sections['member-form']=()=>form(field('name','Nama pengguna','Sari Wulandari','text','',true)+field('username','Nama untuk masuk','sari.wulandari','text','',true)+(params.get('mode')==='edit'||state==='edit'?'':field('temporary-password','Sandi sementara','','password','',true,'Minimal 12 karakter. Serahkan langsung ke pengguna; wajib diganti saat masuk.'))+select('member-role','Role',['Operator','Admin'])+`<fieldset><legend>Penugasan kandang untuk operator</legend>${check('assign-a','Kandang A',true)}${check('assign-b','Kandang B')}${check('assign-c','Kandang C',true)}</fieldset>`+select('active','Status akun',['Aktif','Nonaktif'])+notice('Akun baru menggunakan sandi sementara','Pengelola menyerahkan akses secara langsung. Pengguna mengganti sandi saat masuk; preview tidak membuat akun atau mengirim undangan.'),'Simpan akses');
sections['home']=()=>`<div class="metric"><p>Telur yang tercatat hari ini</p><p class="value num">3.730 <span class="unit">butir</span></p><p class="small">2 dari 3 kandang tercatat · diperbarui 09.40 WIB</p><div class="progress" aria-hidden="true"><span></span></div></div><div class="metrics-pair"><div><p class="small muted">Pakan tercatat</p><strong class="num">490 kg</strong></div><div><p class="small muted">Temuan terbuka</p><strong class="num">1 temuan</strong></div></div>`+section('Perlu perhatian',`<div class="rows">${row('Kandang C belum dicatat','Pakan dan telur hari ini belum tersedia','daily-form','Belum dicatat','warn')}${row('Stok pakan melewati batas minimum','Layer L · 3.050 kg; batas 3.200 kg','feed-stock','Periksa persediaan','warn')}${row('2 ayam terlihat lesu','Kandang C · petugas belum ditetapkan','incident-detail','Perlu penugasan','warn')}</div>`)+section('Pencatatan kandang',`<div class="rows">${row('Kandang A','2.050 butir · 270 kg','daily-history','Diterima sistem','good')}${row('Kandang B','1.680 butir · 220 kg','daily-history','Diterima sistem','good')}</div>`)+`<div class="actions">${link('reports','Lihat laporan','primary')}${link('today','Lihat pekerjaan hari ini')}</div>`;
sections['today']=()=>notice('1 catatan menunggu dikirim','Catatan tetap ada di perangkat. Buka status pengiriman untuk melihat hasilnya.','warn')+section('Catatan kandang',`<div class="rows">${row('Kandang A','LYR-A-2601 · Total pakan dan telur','daily-form','Draft di perangkat')}${row('Kandang C','LYR-C-2603 · Total pakan dan telur','daily-form','Belum dicatat','warn')}</div><div class="actions">${link('daily-form','Catat harian','primary')}</div>`)+section('Pekerjaan Anda',`<div class="rows">${row('Periksa air minum','Kandang A · 08.00 · Sari Wulandari','task-detail','Belum selesai','warn')}${row('Periksa kondisi ayam','Kandang C · 10.00 · Sari Wulandari','task-detail','Belum selesai')}${row('Bersihkan area pakan','Kandang A · 06.00','task-detail','Selesai, diterima sistem','good')}</div>`,role==='operator'?'':link('task-form','Jadwalkan','text-link'));
sections['task-form']=()=>form(field('task','Nama pekerjaan','Periksa air minum','text','',true)+select('type','Jenis pekerjaan',['Operasional','Pemeriksaan','Vaksinasi sesuai SOP'])+cagePicker()+select('assignee','Petugas',['Sari Wulandari','Rina Handayani'])+field('date','Tanggal','2026-10-01','date','',true)+field('time','Jam','08:00','time','',true)+select('repeat','Pengulangan',['Tidak berulang','Harian','Mingguan'])+area('sop','Petunjuk atau rujukan SOP','Periksa ketersediaan air, kebersihan wadah, dan aliran air. Catat kendala yang ditemukan.',true)+notice('Jadwal mengikuti SOP peternakan','Tanggal dan tindakan medis dimasukkan pengelola berdasarkan arahan petugas kesehatan hewan.'),'Simpan tugas');
sections['task-detail']=()=>status('Belum selesai','warn')+section('Checklist pemeriksaan',form(`<fieldset><legend class="sr-only">Checklist air minum</legend>${check('water','Air tersedia',true)}${check('clean','Wadah sudah diperiksa',true)}${check('flow','Aliran air lancar')}</fieldset>`+area('note','Hasil atau kendala','Aliran air di sisi timur perlu diperiksa.')+`<p class="hint">Selesaikan setelah pemeriksaan dilakukan. Kendala boleh disimpan tanpa menandai selesai.</p>`,'Selesaikan tugas','pending',button('Simpan kendala','note')));
sections['daily-form']=()=>{
const frozen=['pending','read-only','success'].includes(state);
const correction=state==='correction';
const body=cagePicker()+field('date','Tanggal catatan','2026-10-01','date','',true)+section('Pakan dan telur',select('feed','Jenis pakan',['Layer L'])+field('feed-qty','Pakan dipakai',correction?'272':frozen?'270':'','number','kg',true)+field('eggs','Telur terkumpul',frozen||correction?'2050':'','number','butir',true)+`<p class="hint">Isi total hari ini. Angka kosong berarti belum dicatat; isi 0 hanya jika jumlahnya memang nol.</p>`)+`<details class="optional-fields" ${frozen||correction?'open':''}><summary ${tag}>Kondisi dan populasi (opsional)</summary>`+(field('deaths','Kematian yang dicatat',frozen||correction?'2':'','number','ekor')+select('population-type','Perubahan populasi lain',['Belum dicatat','Tidak ada perubahan','Ayam masuk','Ayam keluar'])+field('movement','Jumlah ayam pindah','','number','ekor',false,'Isi jika ada ayam masuk/keluar; tulis asal atau tujuan pada keterangan.')+select('observed','Kondisi yang diamati',['Belum diperiksa','Sudah diperiksa, tidak ada temuan','Ada temuan'],frozen||correction?'Sudah diperiksa, tidak ada temuan':'Belum diperiksa')+area('note','Keterangan (opsional)','Pakan ditimbang sebelum diberikan.')+photo())+`</details>`+(correction?area('reason','Alasan revisi','Hasil pemeriksaan timbangan menunjukkan pemakaian 272 kg.',true)+notice('Revisi disimpan bersama riwayat','Pakan berubah melalui transaksi koreksi. Versi sebelumnya tetap dapat ditelusuri.'):'');
if(frozen)return `<div class="readonly">${body}</div><div class="actions">${link('sync-center','Lihat status pengiriman','primary')}${role!=='operator'&&state==='read-only'?button('Revisi catatan','state:correction'):''}${link('incident-form','Laporkan temuan')}</div><p class="hint">Catatan menunggu atau sudah diterima tidak diubah langsung oleh operator.</p>`;
return form(body,correction?'Simpan revisi':'Simpan catatan','pending',button('Simpan draft','draft'));
};

sections['daily-history']=()=>field('date-filter','Tanggal','2026-10-01','date')+select('cage-filter','Kandang',role==='operator'?['Semua penugasan','Kandang A','Kandang C']:['Semua kandang','Kandang A','Kandang B','Kandang C'])+`<div class="rows" id="filterable">${row('Kandang A · 1 Oktober 2026','2.050 butir · 270 kg','daily-form','Diterima sistem','good').replace(href('daily-form'),href('daily-form','read-only'))}${role==='operator'?'':row('Kandang B · 1 Oktober 2026','1.680 butir · 220 kg','daily-form','Diterima sistem','good').replace(href('daily-form'),href('daily-form','read-only'))}${row('Kandang C · 1 Oktober 2026','Pakan dan telur belum tersedia','daily-form','Draft di perangkat')}${row('Kandang A · 30 September 2026','2.010 butir · 265 kg','daily-form','Diterima sistem','good').replace(href('daily-form'),href('daily-form','read-only'))}</div><p class="no-results" hidden>Tidak ada catatan pada tanggal dan kandang ini.</p><div class="actions">${link('daily-form','Catat harian','primary')}</div>`;
sections['feed-stock']=()=>`<div class="metric"><p>Layer L</p><p class="value num">3.050 <span class="unit">kg</span></p><p class="small">Saldo diterima · 1 Oktober 2026, 09.40 WIB</p></div>`+notice('Di bawah batas minimum','Batas minimum Layer L adalah 3.200 kg. Periksa rencana penerimaan pakan.','warn')+`<div class="actions">${link('feed-entry','Catat penerimaan','primary')}${link('feed-entry','Koreksi stok','secondary','correction')}</div>`+section('Perubahan stok',`<div class="rows"><div class="row"><div class="row-main"><strong>Saldo awal terverifikasi</strong><p>1 Oktober · 05.00 WIB</p></div><div class="row-value num">3.540 kg</div></div><div class="row"><div class="row-main"><strong>Pemakaian Kandang A</strong><p>Dari catatan harian · 09.12 WIB</p></div><div class="row-value num">−270 kg</div></div><div class="row"><div class="row-main"><strong>Pemakaian Kandang B</strong><p>Dari catatan harian · 09.40 WIB</p></div><div class="row-value num">−220 kg</div></div></div><p class="hint">Pemakaian berasal dari catatan harian, sehingga tidak perlu dicatat ulang di sini.</p>`)+`<div class="actions">${link('feed-type-form','Atur jenis dan batas stok')}</div>`;
sections['feed-entry']=()=>{
const correction=state==='correction';
const large=state==='large-value';

function feedback(text){document.getElementById('feedback').textContent=text;}
function fieldError(el,text){const parent=el.closest('.field');if(parent){parent.classList.add('invalid');const error=parent.querySelector('.field-error');if(error){error.textContent=text;el.setAttribute('aria-describedby',error.id);}}el.setAttribute('aria-invalid','true');}
function validate(formEl){let invalid=[];formEl.querySelectorAll('input,textarea,select').forEach(el=>{el.removeAttribute('aria-invalid');el.closest('.field')?.classList.remove('invalid');const err=el.closest('.field')?.querySelector('.field-error');if(err)err.textContent='';if(el.disabled)return;let text='';if(el.required&&!el.value.trim())text='Isi kolom ini terlebih dahulu.';if(el.type==='number'&&el.value!==''&&(!Number.isFinite(Number(el.value))||Number(el.value)<0))text='Gunakan angka nol atau lebih.';if(el.type==='number'&&el.step==='1'&&el.value!==''&&!Number.isInteger(Number(el.value)))text='Gunakan jumlah tanpa pecahan.';if(el.type==='password'&&el.value&&el.minLength>0&&el.value.length<el.minLength)text='Gunakan sandi minimal 12 karakter.';if(text){fieldError(el,text);invalid.push(el);}});
if(CFG.id==='account'){const a=formEl.querySelector('#new-password'),b=formEl.querySelector('#repeat-password');if(a.value!==b.value){fieldError(b,'Sandi baru dan pengulangannya belum sama.');invalid.push(b);}}

if(CFG.id==='daily-form'){
  const mode=formEl.querySelector('#population-type'),qty=formEl.querySelector('#movement');
  if(mode&&['Ayam masuk','Ayam keluar'].includes(mode.value)&&(!qty.value||Number(qty.value)<=0)){fieldError(qty,'Isi jumlah ayam yang masuk atau keluar.');invalid.push(qty);}
}
if(CFG.id==='task-detail'){
  const unchecked=formEl.querySelector('input[type=checkbox]:not(:checked)');
  if(unchecked){feedback('Tandai pemeriksaan yang sudah dilakukan atau simpan kendala dahulu.');invalid.push(unchecked);}
}
if(invalid.length){invalid[0].focus();return false;}
return true;}
function openDialog(title,message,action){lastFocus=document.activeElement;dialogAction=action;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-message').textContent=message;document.getElementById('dialog-confirm').textContent=title==='Keluar akun?'?'Keluar akun':'Tinggalkan isian';document.getElementById('app-dialog').showModal();}
function updateReport(){if(CFG.id!=='reports'||!document.getElementById('report-content'))return;const cage=document.getElementById('report-cage').value;let egg=cage==='Kandang A'?'2.050':cage==='Kandang B'?'1.680':cage==='Kandang C'?'Belum dicatat':'3.730';let feed=cage==='Kandang A'?'270':cage==='Kandang B'?'220':cage==='Kandang C'?'Belum dicatat':'490';const start=document.getElementById('start-date').value,end=document.getElementById('end-date').value;document.getElementById('report-content').innerHTML=`<div class="metric"><p>Produksi telur tercatat</p><p class="value num">${egg} ${egg==='Belum dicatat'?'':'<span class="unit">butir</span>'}</p><p class="small">${cage} · ${escapeHTML(start)} sampai ${escapeHTML(end)}</p></div>${(cage==='Kandang C'||cage==='Semua kandang')?notice('Data belum lengkap','Kandang C belum dicatat pada tanggal contoh.','warn'):notice('Catatan periode tersedia','Data contoh telah diterima sistem.','good')}<div class="stat-line"><span>Pakan tercatat</span><span class="num">${feed}${feed==='Belum dicatat'?'':' kg'}</span></div><p class="hint">Dataset preview hanya memuat 1 Oktober 2026. Data diterima hingga 09.40 WIB; rentang lain ditampilkan kosong.</p>`;if(start>'2026-10-01'||end<'2026-10-01')document.getElementById('report-content').innerHTML=notice('Belum ada catatan dalam periode ini','Pilih periode yang memuat 1 Oktober 2026 untuk meninjau data contoh.');}
function wire(){
document.querySelectorAll('#app input,#app textarea,#app select').forEach(el=>el.addEventListener('input',()=>{if(el.closest('form')||el.id==='assignee')dirty=true;}));
document.getElementById('product-form')?.addEventListener('submit',e=>{e.preventDefault();if(!validate(e.currentTarget))return;if(state==='local-failure'){feedback('Belum tersimpan. Isian tetap ada; periksa ruang penyimpanan perangkat.');return;}dirty=false;setState(e.currentTarget.dataset.result);});
document.getElementById('search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();let count=0;document.querySelectorAll('#filterable .row').forEach(row=>{row.hidden=!row.textContent.toLowerCase().includes(q);if(!row.hidden)count++;});const empty=document.querySelector('.no-results');if(empty)empty.hidden=Boolean(count);});
document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));const q=el.dataset.filter;if(CFG.id==='flock-list'){setState(q==='Selesai'?'finished':'default');return;}let count=0;document.querySelectorAll('#filterable .row').forEach(row=>{row.hidden=q!=='Semua'&&!row.textContent.toLowerCase().includes(q.toLowerCase());if(!row.hidden)count++;});const empty=document.querySelector('.no-results');if(empty)empty.hidden=Boolean(count);}));
['date-filter','cage-filter'].forEach(id=>document.getElementById(id)?.addEventListener('change',()=>{const date=document.getElementById('date-filter').value;const cage=document.getElementById('cage-filter').value;const label=date==='2026-10-01'?'1 Oktober 2026':date==='2026-09-30'?'30 September 2026':null;let count=0;document.querySelectorAll('#filterable .row').forEach(row=>{row.hidden=!label||!row.textContent.includes(label)||(!cage.startsWith('Semua')&&!row.textContent.includes(cage));if(!row.hidden)count++;});document.querySelector('.no-results').hidden=Boolean(count);}));
document.getElementById('entry-type')?.addEventListener('change',e=>setState(e.target.value==='Koreksi stok'?'correction':'default',false));
['quantity','price'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>{const total=document.getElementById('purchase-total');if(total)total.textContent='Rp'+new Intl.NumberFormat('id-ID').format(Number(document.getElementById('quantity').value)*Number(document.getElementById('price').value));}));
document.querySelector('input[name=notify]')?.addEventListener('change',e=>feedback(e.target.checked?'Pengingat contoh diaktifkan.':'Pengingat contoh dinonaktifkan.'));
 document.getElementById('photo')?.addEventListener('change',e=>{document.getElementById('photo-status').textContent=e.target.files.length?'Foto dipilih: '+e.target.files[0].name+'. Belum dikirim pada preview.':'Belum ada foto dipilih.';});
document.getElementById('member-role')?.addEventListener('change',e=>{document.querySelectorAll('input[name^=assign]').forEach(el=>el.disabled=e.target.value==='Admin');});
document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const action=el.dataset.action;if(action.startsWith('state:')){setState(action.slice(6),false);return;}if(action==='retry'){setState('default',false);return;}if(action==='draft'){snapshot();dirty=false;feedback('Draft tersimpan di perangkat. Pakan dan telur boleh dilengkapi sebelum dikirim.');return;}if(action==='note'){snapshot();dirty=false;feedback('Kendala tersimpan di perangkat. Pekerjaan tetap belum selesai.');return;}if(action==='assign'){const assignee=document.getElementById('assignee').value;setState('default');dirty=false;feedback('Penugasan contoh disimpan untuk '+assignee+'.');return;}if(action==='choose-photo'){document.getElementById('photo').click();return;}if(action==='settings'){feedback('Pada Flutter, aksi ini membuka pengaturan izin perangkat. Preview tidak mengubah izin komputer.');return;}if(action==='logout'){openDialog('Keluar akun?','Ada catatan belum terkirim. Catatan tetap tersimpan dan terkunci pada akun ini sampai Anda masuk kembali.',()=>{dirty=false;location.href=href('login');});return;}if(action==='sync'){if(state==='conflict'){feedback('Catatan konflik belum dikirim. Tinjau catatan sebelum mencoba lagi.');return;}setState('success');return;}if(action==='report'){const start=document.getElementById('start-date'),end=document.getElementById('end-date');if(!start.value||!end.value||start.value>end.value){feedback('Pilih tanggal akhir yang sama atau setelah tanggal awal.');end.focus();return;}updateReport();feedback('Laporan contoh diperbarui sesuai filter.');return;}if(action==='export'){if(state==='export-failure'){feedback('CSV belum dibuat. Ubah state preview untuk mencoba skenario berhasil.');return;}
const cage=document.getElementById('report-cage').value;
const start=document.getElementById('start-date').value,end=document.getElementById('end-date').value;
if(!start||!end||start>end){feedback('Periksa rentang tanggal sebelum ekspor.');return;}
const rows=[['2026-10-01','Kandang A','2050','270','Diterima'],['2026-10-01','Kandang B','1680','220','Diterima'],['2026-10-01','Kandang C','','','Belum dicatat']].filter(r=>r[0]>=start&&r[0]<=end&&(cage==='Semua kandang'||r[1]===cage));
const content='Data contoh TERNAVA; bukan data peternakan nyata\nTanggal,Kandang,Telur_butir,Pakan_kg,Status\n'+rows.map(r=>r.join(',')).join('\n')+'\n';
const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='TERNAVA-data-contoh.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);feedback('CSV data contoh dibuat.');return;}}));
document.querySelectorAll('#app a[href]').forEach(el=>el.addEventListener('click',e=>{if(!dirty)return;e.preventDefault();openDialog('Tinggalkan isian?','Ada isian yang belum disimpan. Simpan draft atau tetap di layar ini jika masih diperlukan.',()=>{dirty=false;location.href=el.href;});}));
}
document.getElementById('state-select').addEventListener('change',e=>setState(e.target.value,false));
document.getElementById('role-select').addEventListener('change',e=>{role=e.target.value;fieldValues={};render();});

document.getElementById('app-dialog').addEventListener('keydown',e=>{
 if(e.key!=='Tab')return;
 const targets=[...e.currentTarget.querySelectorAll('button:not(:disabled)')];
 const first=targets[0],last=targets[targets.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
document.getElementById('dialog-cancel').addEventListener
('click',()=>document.getElementById('app-dialog').close());
document.getElementById('dialog-confirm').addEventListener('click',()=>{const fn=dialogAction;document.getElementById('app-dialog').close();if(fn)fn();});
document.getElementById('app-dialog').addEventListener('close',()=>lastFocus?.focus());
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
render();

</script></body></html>
