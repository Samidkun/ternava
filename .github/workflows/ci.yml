name: TERNAVA planning and application gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  planning-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: bash scripts/local-ci.sh --planning
  application-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ternava_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require applications and locked toolchain
        run: |
          test -f mobile/pubspec.lock
          test -f backend/composer.lock
          test -f toolchain/flutter-version.txt
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', tools: composer, extensions: pdo_pgsql }
      - id: toolchain
        run: echo "flutter=$(cat toolchain/flutter-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          channel: stable
          cache: true
      - name: Install scanner (pin version/digest at toolchain freeze)
        run: |
          sudo apt-get update
          sudo apt-get install -y gitleaks
      - name: Full local gates
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ternava_test
          DB_USERNAME: postgres
          DB_PASSWORD: changeme
        run: bash scripts/local-ci.sh --full

  # AC-42: verify the release artifacts on every push/PR. This job only
  # verifies — it never publishes. Publishing is a separate, manual,
  # approval-gated step, so a failing gate cannot ship automatically.
  release-artifacts:
    runs-on: ubuntu-latest
    needs: [planning-contracts, application-gates]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install apksigner (Android build-tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools || true
          # Fall back to the SDK that the runner ships with if the package is absent.
          if ! command -v apksigner >/dev/null; then
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
            find "${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}" -name apksigner 2>/dev/null | head -1 \
              | xargs -r -I{} sudo ln -sf {} /usr/local/bin/apksigner
          fi
          command -v apksigner
      - name: Build the backend image (digest is part of the release)
        run: docker build -t ternava-api:latest backend
      - name: Release verify (SBOM, fail-closed, locked provenance)
        run: bash ops/release.sh --selfcheck
